name: SM-CFHR Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,parquet]"
      - name: Run unit, sklearn, and persistence tests
        run: |
          python -m pytest tests/test_adaptive_structured_huber.py tests/test_selector_ashr_v2.py tests/test_bloqueadores_v1_1.py -v
